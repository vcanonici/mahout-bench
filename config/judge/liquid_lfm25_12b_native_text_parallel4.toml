[judge]
model = "liquid/lfm2.5-1.2b"
api_base_url = "http://127.0.0.1:1234"
api_mode = "lmstudio_native_chat"
api_key = "lm-studio"
temperature = 0.3
top_p = 1.0
max_tokens = 256
context_length = 128000
parallelism = 1
thinking_enabled = false
reasoning_effort = "low"
output_mode = "text_binary_label"
system_prompt = "Judge the advice. Just output the number."

[lifecycle]
# Legacy no-op section; LM Studio loading is managed outside the runner.
load_command = ""
unload_command = ""

[judge_prompts]
prefix = ""
suffix = ""
