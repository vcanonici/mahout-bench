# Copy this file into config/profiles/<Name>.toml and change name/system_prompt.
#
# The TUI chooses model, provider, pools, precision, judge and output folder.
# Profiles should usually define only identity, generation hyperparameters and
# system_prompt. Dataset defaults come from the runner.

[profile]
name = "Example"
description = "Short human-readable purpose for this profile."

[generation]
temperature = 0.8
top_p = 1.0
max_tokens = 4096
context_length = 16384
thinking_enabled = true
reasoning_effort = "low"
include_reasoning_parameter = true
system_prompt = """Write the system prompt that defines this benchmark persona."""
